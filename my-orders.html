<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders - VOIDXHUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Orbitron', sans-serif; background: #05050a; color: #e0e0ff; min-height: 100vh; }
    .card { background: rgba(17,17,28,0.95); border: 1px solid rgba(103,232,249,0.3); border-radius: 16px; }
    input { background: rgba(0,255,255,0.05); border: 1.5px solid #00ffff; color: #e0e0ff; font-family: 'Orbitron', sans-serif; }
    input:focus { outline: none; border-color: #ff00ff; }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-3xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <div>
        <h1 class="text-3xl font-black text-cyan-400 tracking-widest">MY ORDERS</h1>
        <p class="text-gray-400 text-sm mt-1">Download links after admin verifies payment</p>
      </div>
      <a href="tools.html" class="text-gray-400 hover:text-cyan-300 text-sm">← Tools</a>
    </div>

    <div class="card p-6 mb-8">
      <h2 class="text-sm font-bold text-cyan-300 mb-4 tracking-wider">LOOKUP ORDER</h2>
      <div class="grid sm:grid-cols-3 gap-3 items-end">
        <div>
          <label class="text-xs text-gray-400 mb-1 block">Order Code</label>
          <input type="text" id="orderCode" placeholder="VxH-XXXXXXXX" class="w-full px-3 py-2 rounded-lg text-sm">
        </div>
        <div>
          <label class="text-xs text-gray-400 mb-1 block">Telegram</label>
          <input type="text" id="telegram" placeholder="@username" class="w-full px-3 py-2 rounded-lg text-sm">
        </div>
        <button onclick="lookup()" class="py-2.5 bg-gradient-to-r from-cyan-500 to-purple-600 text-black font-bold rounded-lg text-sm">FIND</button>
      </div>
      <p id="lookupMsg" class="text-sm mt-3 hidden"></p>
    </div>

    <div id="ordersList" class="space-y-4"></div>
    <p id="emptyMsg" class="text-center text-gray-500 py-10">No orders loaded. Enter order code above.</p>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const API = "https://voidxhub-backend.onrender.com";

    // Prefill last order
    const last = localStorage.getItem("vxh_last_order");
    const lastTg = localStorage.getItem("vxh_last_tg");
    if (last) document.getElementById("orderCode").value = last;
    if (lastTg) document.getElementById("telegram").value = lastTg;

    function renderOrder(o) {
      const statusColor = o.status === 'delivered' ? 'text-green-400' : o.status === 'pending' ? 'text-yellow-400' : 'text-gray-400';
      let linkHtml = '';
      if (o.status === 'delivered' && o.download_link) {
        linkHtml = `<a href="${o.download_link}" target="_blank" class="inline-block mt-3 px-5 py-2 bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-bold rounded-lg text-sm hover:scale-105 transition">⬇ DOWNLOAD</a>`;
      } else if (o.status === 'pending') {
        linkHtml = `<p class="text-yellow-400 text-xs mt-3">⏳ Waiting for admin to verify & send link</p>`;
      }

      return `
        <div class="card p-5">
          <div class="flex justify-between items-start gap-4">
            <div>
              <p class="text-cyan-300 font-bold">${o.order_code}</p>
              <p class="text-sm text-white mt-1">${(o.tool||'').toUpperCase()} • ${(o.plan_type||'').toUpperCase()} • ${(o.brand||'').toUpperCase()}</p>
              <p class="text-xs text-gray-500 mt-1">${o.credits || 0} VxH Cr • ₹${o.price_inr || 0} • ${o.created_at || ''}</p>
            </div>
            <span class="${statusColor} text-xs font-bold uppercase">${o.status}</span>
          </div>
          ${linkHtml}
          ${o.admin_note ? `<p class="text-xs text-gray-400 mt-2">Note: ${o.admin_note}</p>` : ''}
        </div>
      `;
    }

    async function lookup() {
      const code = document.getElementById("orderCode").value.trim();
      const tg = document.getElementById("telegram").value.trim();
      const msg = document.getElementById("lookupMsg");
      if (!code) {
        msg.className = "text-sm mt-3 text-red-400";
        msg.textContent = "Enter order code";
        msg.classList.remove("hidden");
        return;
      }

      try {
        const res = await fetch(API + "/api/orders/lookup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ order_code: code, telegram: tg })
        });
        const data = await res.json();
        if (data.success) {
          document.getElementById("emptyMsg").classList.add("hidden");
          document.getElementById("ordersList").innerHTML = renderOrder(data.order);
          msg.className = "text-sm mt-3 text-green-400";
          msg.textContent = "Order found";
          msg.classList.remove("hidden");
        } else {
          msg.className = "text-sm mt-3 text-red-400";
          msg.textContent = data.message || "Not found";
          msg.classList.remove("hidden");
        }
      } catch (e) {
        msg.className = "text-sm mt-3 text-red-400";
        msg.textContent = "Server error / cold start. Retry in 30s.";
        msg.classList.remove("hidden");
      }
    }

    // Auto lookup if last order exists
    if (last) setTimeout(lookup, 500);
  </script>
</body>
</html>
