<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOIDXHUB - APEX LEGENDS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: #05050a;
      color: #e0e0ff;
      overflow-x: hidden;
      min-height: 100vh;
    }
    .bg-blackhole {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at top, #1a0033 0%, #05050a 70%);
      z-index: -3;
    }
    .void-logo-bg {
      position: fixed;
      inset: 0;
      background: url('sQz8x (1).jpg') center/cover no-repeat;
      opacity: 0.08;
      filter: blur(3px) brightness(1.2);
      animation: logoPulse 25s ease-in-out infinite;
      z-index: -2;
      mix-blend-mode: screen;
    }
    @keyframes logoPulse {
      0%, 100% { opacity: 0.06; transform: scale(1); }
      50% { opacity: 0.12; transform: scale(1.05); }
    }
    .tool-card {
      background: rgba(17, 17, 28, 0.92);
      border: 1.5px solid rgba(248, 113, 113, 0.3);
      border-radius: 22px;
      overflow: hidden;
      transition: all 0.55s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      min-height: 260px;
    }
    .tool-card:hover {
      transform: translateY(-10px) scale(1.02);
      border-color: #f87171;
      box-shadow: 0 20px 50px rgba(248, 113, 113, 0.2);
    }
    .fade-up {
      opacity: 0;
      transform: translateY(25px);
      animation: fadeUp 0.7s ease forwards;
    }
    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="bg-blackhole"></div>
  <div class="void-logo-bg"></div>

  <div class="relative z-10 py-16 px-4 md:px-6">
    <div class="max-w-7xl mx-auto">

      <div class="text-center mb-12 fade-up">
        <h1 class="text-4xl md:text-6xl font-black tracking-wider mb-3 text-red-300">APEX LEGENDS</h1>
        <p class="text-lg text-red-200 tracking-widest">TOOLS COMING SOON</p>
        <div class="w-24 h-1 bg-gradient-to-r from-red-400 to-rose-500 mx-auto mt-4 rounded-full"></div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 md:gap-8 max-w-5xl mx-auto">

        <!-- Empty Card 1 -->
        <div class="tool-card fade-up" style="animation-delay:0.1s">
          <div class="flex flex-col items-center justify-center h-full min-h-[260px] p-6 text-center">
            <div class="text-4xl mb-3 opacity-30">+</div>
            <h3 class="text-lg font-bold text-gray-400 mb-2">EMPTY SLOT 1</h3>
            <p class="text-sm text-gray-500">Coming Soon</p>
          </div>
        </div>

        <!-- Empty Card 2 -->
        <div class="tool-card fade-up" style="animation-delay:0.15s">
          <div class="flex flex-col items-center justify-center h-full min-h-[260px] p-6 text-center">
            <div class="text-4xl mb-3 opacity-30">+</div>
            <h3 class="text-lg font-bold text-gray-400 mb-2">EMPTY SLOT 2</h3>
            <p class="text-sm text-gray-500">Coming Soon</p>
          </div>
        </div>

        <!-- Empty Card 3 -->
        <div class="tool-card fade-up" style="animation-delay:0.2s">
          <div class="flex flex-col items-center justify-center h-full min-h-[260px] p-6 text-center">
            <div class="text-4xl mb-3 opacity-30">+</div>
            <h3 class="text-lg font-bold text-gray-400 mb-2">EMPTY SLOT 3</h3>
            <p class="text-sm text-gray-500">Coming Soon</p>
          </div>
        </div>

        <!-- Empty Card 4 -->
        <div class="tool-card fade-up" style="animation-delay:0.25s">
          <div class="flex flex-col items-center justify-center h-full min-h-[260px] p-6 text-center">
            <div class="text-4xl mb-3 opacity-30">+</div>
            <h3 class="text-lg font-bold text-gray-400 mb-2">EMPTY SLOT 4</h3>
            <p class="text-sm text-gray-500">Coming Soon</p>
          </div>
        </div>

        <!-- Empty Card 5 -->
        <div class="tool-card fade-up" style="animation-delay:0.3s">
          <div class="flex flex-col items-center justify-center h-full min-h-[260px] p-6 text-center">
            <div class="text-4xl mb-3 opacity-30">+</div>
            <h3 class="text-lg font-bold text-gray-400 mb-2">EMPTY SLOT 5</h3>
            <p class="text-sm text-gray-500">Coming Soon</p>
          </div>
        </div>

      </div>

      <div class="text-center mt-16 fade-up">
        <button onclick="window.location.href='../shop/tools.html'" class="text-gray-400 hover:text-cyan-300 transition text-sm tracking-wider">
          ← BACK TO GAMES
        </button>
      </div>
    </div>
  </div>

  <div class="fixed bottom-6 right-6 z-50">
    <button onclick="window.open('https://t.me/Voidxhubsupport_bot', '_blank')"
            class="flex items-center gap-2 bg-gradient-to-r from-purple-600 to-pink-600 text-white font-bold px-6 py-3.5 rounded-2xl shadow-2xl border border-white/20 hover:scale-105 transition-all">
      <span>💬 Help</span>
    </button>
  </div>
</body>
</html>
