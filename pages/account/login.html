<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — VOIDXHUB</title>
  <meta name="description" content="Login to your VOIDXHUB account to access tools, orders and dashboard.">
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0f; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .box { background: rgba(15,15,25,0.95); border: 1px solid rgba(148,163,184,0.15); border-radius: 20px; width: 100%; max-width: 400px; padding: 36px; }
    input { background: rgba(255,255,255,0.04); border: 1px solid rgba(148,163,184,0.2); color: #e2e8f0; }
    input:focus { outline: none; border-color: #67e8f9; box-shadow: 0 0 0 3px rgba(103,232,249,0.12); }
    .btn-primary { background: linear-gradient(135deg, #06b6d4, #8b5cf6); }
  </style>
</head>
<body>
  <div class="box">
    <div class="text-center mb-8">
      <a href="/" class="text-2xl font-bold tracking-tight">VOID<span class="text-cyan-400">X</span>HUB</a>
      <p class="text-sm text-slate-400 mt-1">Login to your account</p>
    </div>

    <div id="msg" class="hidden mb-4 p-3 rounded-xl text-sm text-center"></div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs text-slate-400 mb-1.5 font-medium">Username or Email</label>
        <input type="text" id="username" required placeholder="Enter username or email" class="w-full px-4 py-3 rounded-xl text-sm" autocomplete="username">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1.5 font-medium">Password</label>
        <div class="relative">
          <input type="password" id="password" required placeholder="Enter password" class="w-full px-4 py-3 rounded-xl text-sm pr-12" autocomplete="current-password">
          <button type="button" onclick="togglePassword()" id="toggleBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-cyan-400 transition">Show</button>
        </div>
      </div>

      <div class="flex justify-end">
        <a href="https://t.me/Voidxhubsupport_bot" target="_blank" rel="noopener" class="text-xs text-cyan-400 hover:underline">Forgot / Reset Password?</a>
      </div>

      <button type="submit" id="btn" class="btn-primary w-full py-3.5 rounded-xl text-sm font-semibold text-white hover:opacity-90 transition">
        Login
      </button>
    </form>

    <div class="text-center mt-6 text-sm text-slate-400">
      Don't have an account?
      <a href="/pages/account/register.html" class="text-cyan-400 font-medium hover:underline">Register</a>
    </div>
  </div>

  <script>
    const API = "https://voidxhub-backend.onrender.com";

    function togglePassword() {
      const input = document.getElementById("password");
      const btn = document.getElementById("toggleBtn");
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Hide";
      } else {
        input.type = "password";
        btn.textContent = "Show";
      }
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn");
      const msg = document.getElementById("msg");
      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        const res = await fetch(API + "/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await res.json();

        if (data.token) {
          localStorage.setItem("vxh_user", JSON.stringify(data.user));
          localStorage.setItem("vxh_token", data.token);
          localStorage.setItem("token", data.token);
          localStorage.setItem("user", JSON.stringify(data.user));

          msg.className = "mb-4 p-3 rounded-xl text-sm text-center bg-green-500/10 text-green-300 border border-green-500/30";
          msg.textContent = "Login successful! Redirecting...";
          msg.classList.remove("hidden");

          const isAdmin = data.user && data.user.role === "admin";
          const target = isAdmin ? "/pages/admin/admin-panel.html" : "/pages/account/dashboard.html";
          setTimeout(() => window.location.href = target, 800);
        } else {
          msg.className = "mb-4 p-3 rounded-xl text-sm text-center bg-red-500/10 text-red-300 border border-red-500/30";
          msg.textContent = data.error || data.message || "Login failed";
          msg.classList.remove("hidden");
          btn.disabled = false;
          btn.textContent = "Login";
        }
      } catch (err) {
        msg.className = "mb-4 p-3 rounded-xl text-sm text-center bg-red-500/10 text-red-300 border border-red-500/30";
        msg.textContent = "Server unavailable. Please wait 20-30 seconds and try again (cold start).";
        msg.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Login";
      }
    });
  </script>
</body>
</html>
