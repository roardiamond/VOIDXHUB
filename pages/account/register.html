<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - VOIDXHUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; background: #0a0a0f; color: #e2e8f0; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .box { background: rgba(15,15,25,0.95); border: 1px solid rgba(148,163,184,0.15); border-radius: 20px; width: 100%; max-width: 400px; padding: 36px; }
    input { background: rgba(255,255,255,0.04); border: 1px solid rgba(148,163,184,0.2); color: #e2e8f0; }
    input:focus { outline: none; border-color: #67e8f9; box-shadow: 0 0 0 3px rgba(103,232,249,0.12); }
    .btn-primary { background: linear-gradient(135deg, #06b6d4, #8b5cf6); }
  </style>
</head>
<body>
  <div class="box">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold tracking-tight">VOID<span class="text-cyan-400">X</span>HUB</h1>
      <p class="text-sm text-slate-400 mt-1">Create new account</p>
    </div>

    <div id="msg" class="hidden mb-4 p-3 rounded-xl text-sm text-center"></div>

    <form id="regForm" class="space-y-4">
      <div>
        <label class="block text-xs text-slate-400 mb-1.5 font-medium">Username</label>
        <input type="text" id="username" required minlength="3" placeholder="Min 3 characters" class="w-full px-4 py-3 rounded-xl text-sm">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1.5 font-medium">Email</label>
        <input type="email" id="email" required placeholder="you@example.com" class="w-full px-4 py-3 rounded-xl text-sm">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1.5 font-medium">Password</label>
        <div class="relative">
          <input type="password" id="password" required minlength="8" placeholder="Min 8 characters" class="w-full px-4 py-3 rounded-xl text-sm pr-12">
          <button type="button" onclick="togglePassword()" id="toggleBtn" class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 hover:text-cyan-400 transition">Show</button>
        </div>
      </div>

      <button type="submit" id="btn" class="btn-primary w-full py-3.5 rounded-xl text-sm font-semibold text-white hover:opacity-90 transition">
        Register
      </button>
    </form>

    <div class="text-center mt-6 text-sm text-slate-400">
      Already have an account?
      <a href="login.html" class="text-cyan-400 font-medium hover:underline">Login</a>
    </div>
  </div>

  <script>
    const API = "https://voidxhub-backend.onrender.com";

    function togglePassword() {
      const input = document.getElementById("password");
      const btn = document.getElementById("toggleBtn");
      if (input.type === "password") {
        input.type = "text";
        btn.textContent = "Hide";
      } else {
        input.type = "password";
        btn.textContent = "Show";
      }
    }

    document.getElementById("regForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn");
      const msg = document.getElementById("msg");
      btn.disabled = true;
      btn.textContent = "Creating account...";
      msg.classList.add("hidden");

      try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 25000);

        const res = await fetch(API + "/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          signal: controller.signal,
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            email: document.getElementById("email").value.trim(),
            password: document.getElementById("password").value
          })
        });
        clearTimeout(timeout);

        const data = await res.json();

        if (data.token || data.success) {
          if (data.user) localStorage.setItem("vxh_user", JSON.stringify(data.user));
          if (data.token) localStorage.setItem("vxh_token", data.token);
          msg.className = "mb-4 p-3 rounded-xl text-sm text-center bg-green-500/10 text-green-300 border border-green-500/30";
          msg.textContent = "Account created! Redirecting...";
          msg.classList.remove("hidden");
          setTimeout(() => window.location.href = "dashboard.html", 1000);
        } else {
          msg.className = "mb-4 p-3 rounded-xl text-sm text-center bg-red-500/10 text-red-300 border border-red-500/30";
          msg.textContent = data.error || data.message || "Registration failed";
          msg.classList.remove("hidden");
          btn.disabled = false;
          btn.textContent = "Register";
        }
      } catch (err) {
        msg.className = "mb-4 p-3 rounded-xl text-sm text-center bg-red-500/10 text-red-300 border border-red-500/30";
        if (err.name === "AbortError") {
          msg.textContent = "Request timed out. Server may be starting. Wait 30s and try again.";
        } else {
          msg.textContent = "Network error. Please try again.";
        }
        msg.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "Register";
      }
    });
  </script>
</body>
</html>
