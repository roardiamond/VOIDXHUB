<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - VOIDXHUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: #05050a;
      color: #e0e0ff;
      min-height: 100vh;
    }
  </style>
</head>
<body class="p-6">
  <div class="max-w-4xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-10 gap-4">
      <div>
        <h1 class="text-3xl font-black text-cyan-400 tracking-widest">DASHBOARD</h1>
        <p class="text-gray-400 text-sm mt-1">Welcome back, <span id="username" class="text-pink-400"></span></p>
      </div>
      <div class="flex gap-3">
        <a href="tools.html" class="px-5 py-2 border border-cyan-400 rounded-xl text-cyan-300 hover:bg-cyan-400 hover:text-black transition text-sm font-bold">TOOLS</a>
        <button onclick="logout()" class="px-5 py-2 border border-red-500 rounded-xl text-red-400 hover:bg-red-500 hover:text-white transition text-sm font-bold">LOGOUT</button>
      </div>
    </div>

    <!-- Credits Card -->
    <div class="bg-zinc-950 border border-cyan-500/40 rounded-2xl p-8 mb-8 text-center">
      <p class="text-gray-400 text-sm tracking-wider mb-2">YOUR CREDITS</p>
      <div id="credits" class="text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-500">--</div>
      <button onclick="document.getElementById('buySection').classList.toggle('hidden')"
              class="mt-6 px-8 py-3 bg-gradient-to-r from-cyan-500 to-purple-600 text-black font-bold rounded-xl hover:scale-105 transition">
        + BUY CREDITS
      </button>
    </div>

    <!-- Buy Credits Section -->
    <div id="buySection" class="hidden mb-10">
      <h2 class="text-xl font-bold text-cyan-300 mb-4 tracking-wider">CREDIT PACKAGES</h2>
      <div class="grid sm:grid-cols-2 gap-4" id="packages"></div>
      <p class="text-center text-gray-500 text-xs mt-4">Razorpay Test Mode active</p>
    </div>

    <!-- Features -->
    <div>
      <h2 class="text-xl font-bold text-cyan-300 mb-4 tracking-wider">FEATURES (Credits Cost)</h2>
      <div id="features" class="grid sm:grid-cols-2 gap-4"></div>
    </div>
  </div>

  <script>
    const API = "https://voidxhub-backend.onrender.com";
    let user = JSON.parse(localStorage.getItem("vxh_user") || "null");

    if (!user) {
      window.location.href = "login.html";
    }

    document.getElementById("username").textContent = user.username;
    document.getElementById("credits").textContent = user.credits;

    // Refresh user data
    async function refreshUser() {
      try {
        const res = await fetch(API + "/api/me", { credentials: "include" });
        const data = await res.json();
        if (data.success) {
          user = data.user;
          localStorage.setItem("vxh_user", JSON.stringify(user));
          document.getElementById("credits").textContent = user.credits;
        } else {
          localStorage.removeItem("vxh_user");
          window.location.href = "login.html";
        }
      } catch (e) {}
    }
    refreshUser();

    // Load packages
    async function loadPackages() {
      const res = await fetch(API + "/api/packages");
      const data = await res.json();
      const container = document.getElementById("packages");
      container.innerHTML = "";

      for (const [id, pack] of Object.entries(data.packages)) {
        const div = document.createElement("div");
        div.className = "bg-zinc-900 border border-purple-500/40 rounded-xl p-5 text-center";
        div.innerHTML = `
          <div class="text-2xl font-black text-white">${pack.credits} Credits</div>
          <div class="text-cyan-400 text-lg mt-1">₹${pack.amount / 100}</div>
          <button onclick="buyPackage('${id}')" class="mt-4 w-full py-2 bg-purple-600 hover:bg-purple-500 rounded-lg font-bold text-sm">BUY</button>
        `;
        container.appendChild(div);
      }
    }
    loadPackages();

    // Load features
    async function loadFeatures() {
      const res = await fetch(API + "/api/features");
      const data = await res.json();
      const container = document.getElementById("features");
      container.innerHTML = "";

      for (const [key, f] of Object.entries(data.features)) {
        const div = document.createElement("div");
        div.className = "bg-zinc-900 border border-cyan-500/30 rounded-xl p-4 flex justify-between items-center";
        div.innerHTML = `
          <div>
            <div class="font-bold text-cyan-300">${f.name}</div>
            <div class="text-xs text-gray-500">${key}</div>
          </div>
          <div class="text-pink-400 font-bold">${f.credits} Cr</div>
        `;
        container.appendChild(div);
      }
    }
    loadFeatures();

    async function buyPackage(packId) {
      alert("Razorpay Test Mode.\n\nPayment integration ready.\nJab live keys aayenge tab fully kaam karega.\n\nAbhi test ke liye admin se credits add karwa sakte ho.");
      // Full Razorpay checkout can be added later when keys are live
    }

    function logout() {
      localStorage.removeItem("vxh_user");
      fetch(API + "/api/logout", { method: "POST", credentials: "include" });
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
