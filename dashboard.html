<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - VOIDXHUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Orbitron', sans-serif; background: #05050a; color: #e0e0ff; }
    .card { background: #0a0a15; border: 1px solid rgba(0,255,255,0.2); }
    .glow { box-shadow: 0 0 30px rgba(0,255,255,0.15); }
  </style>
</head>
<body class="min-h-screen">

  <!-- Navbar -->
  <nav class="bg-zinc-950 border-b border-cyan-500/30 px-6 py-4 flex justify-between items-center sticky top-0 z-40">
    <a href="index.html" class="text-2xl font-black text-cyan-400 tracking-wider">VOIDXHUB</a>
    <div class="flex gap-4 items-center">
      <a href="tools.html" class="text-sm text-gray-400 hover:text-cyan-400">Tools</a>
      <a href="scrims.html" class="text-sm text-gray-400 hover:text-cyan-400">Scrims</a>
      <div class="flex items-center gap-3 ml-4">
        <div class="w-9 h-9 rounded-lg bg-gradient-to-br from-cyan-400 to-pink-500 flex items-center justify-center text-black font-black text-sm" id="avatar">U</div>
        <div class="hidden sm:block">
          <p class="text-sm font-bold text-cyan-300" id="navUsername">User</p>
          <p class="text-xs text-pink-400" id="navEmail">email</p>
        </div>
        <button onclick="logout()" class="ml-2 px-4 py-2 bg-red-600/20 border border-red-500 rounded-lg text-xs hover:bg-red-600/40 transition">LOGOUT</button>
      </div>
    </div>
  </nav>

  <div class="max-w-5xl mx-auto p-6">
    <div id="loading" class="text-center py-20">
      <div class="inline-block w-12 h-12 border-4 border-cyan-500/30 border-t-cyan-400 rounded-full animate-spin"></div>
      <p class="mt-4 text-cyan-400">Loading...</p>
    </div>

    <div id="dashboardContent" class="hidden">
      <!-- Welcome -->
      <div class="card rounded-2xl p-8 mb-8 glow">
        <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-pink-500">
          Welcome, <span id="welcomeName">User</span>!
        </h1>
        <p class="text-gray-400 mt-2 text-sm tracking-wide">Manage your VOIDXHUB account</p>
      </div>

      <!-- Stats -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
        <div class="card rounded-2xl p-6 text-center glow">
          <p class="text-3xl font-black text-cyan-400" id="statStatus">Active</p>
          <p class="text-xs text-gray-400 mt-2 tracking-wider">ACCOUNT STATUS</p>
        </div>
        <div class="card rounded-2xl p-6 text-center glow">
          <p class="text-3xl font-black text-pink-400" id="statJoin">-</p>
          <p class="text-xs text-gray-400 mt-2 tracking-wider">MEMBER SINCE</p>
        </div>
        <div class="card rounded-2xl p-6 text-center glow">
          <p class="text-3xl font-black text-green-400">1</p>
          <p class="text-xs text-gray-400 mt-2 tracking-wider">ACTIVE SESSION</p>
        </div>
      </div>

      <!-- Quick Links -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
        <a href="tools.html" class="card rounded-2xl p-6 hover:border-cyan-400 transition group">
          <h3 class="text-lg font-bold text-cyan-300 group-hover:text-cyan-200">🛠 Tools</h3>
          <p class="text-sm text-gray-400 mt-1">Browse premium tools & configs</p>
        </a>
        <a href="scrims.html" class="card rounded-2xl p-6 hover:border-pink-400 transition group">
          <h3 class="text-lg font-bold text-pink-300 group-hover:text-pink-200">🎮 Scrims</h3>
          <p class="text-sm text-gray-400 mt-1">Join paid & free scrims</p>
        </a>
      </div>

      <!-- Profile -->
      <div class="card rounded-2xl p-8 glow">
        <h2 class="text-xl font-black text-cyan-400 mb-6 tracking-wider">PROFILE</h2>
        <div class="space-y-4">
          <div class="flex justify-between items-center py-3 border-b border-zinc-800">
            <span class="text-sm text-gray-400 tracking-wider">USERNAME</span>
            <span class="font-bold text-cyan-300" id="profileUsername">-</span>
          </div>
          <div class="flex justify-between items-center py-3 border-b border-zinc-800">
            <span class="text-sm text-gray-400 tracking-wider">EMAIL</span>
            <span class="font-bold text-pink-300" id="profileEmail">-</span>
          </div>
          <div class="flex justify-between items-center py-3 border-b border-zinc-800">
            <span class="text-sm text-gray-400 tracking-wider">MEMBER SINCE</span>
            <span class="font-bold text-green-300" id="profileJoin">-</span>
          </div>
          <div class="flex justify-between items-center py-3">
            <span class="text-sm text-gray-400 tracking-wider">STATUS</span>
            <span class="font-bold text-green-400">ACTIVE</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    async function checkAuth() {
      try {
        const res = await fetch('backend/auth.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'check_auth' })
        });
        const data = await res.json();
        if (data.authenticated) {
          showDashboard(data.user);
        } else {
          window.location.href = 'login.html';
        }
      } catch (e) {
        window.location.href = 'login.html';
      }
    }

    function showDashboard(user) {
      document.getElementById('loading').classList.add('hidden');
      document.getElementById('dashboardContent').classList.remove('hidden');

      document.getElementById('navUsername').textContent = user.username;
      document.getElementById('navEmail').textContent = user.email;
      document.getElementById('welcomeName').textContent = user.username;
      document.getElementById('profileUsername').textContent = user.username;
      document.getElementById('profileEmail').textContent = user.email;
      document.getElementById('profileJoin').textContent = formatDate(user.created_at);
      document.getElementById('statJoin').textContent = formatDate(user.created_at);
      document.getElementById('avatar').textContent = user.username.charAt(0).toUpperCase();
    }

    function formatDate(str) {
      try {
        return new Date(str).toLocaleDateString('en-IN', { year: 'numeric', month: 'short', day: 'numeric' });
      } catch { return str; }
    }

    function logout() {
      if (!confirm('Logout?')) return;
      fetch('backend/auth.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'logout' })
      }).then(() => window.location.href = 'login.html');
    }

    checkAuth();
  </script>
</body>
</html>
