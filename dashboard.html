<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - VOIDXHUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Orbitron', sans-serif; background: #05050a; color: #e0e0ff; min-height: 100vh; }
    .card { background: rgba(17,17,28,0.9); border: 1px solid rgba(103,232,249,0.25); border-radius: 16px; }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-4xl mx-auto">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-black text-cyan-400 tracking-widest">DASHBOARD</h1>
        <p class="text-gray-400 text-sm mt-1">Welcome, <span id="username" class="text-pink-400 font-bold"></span></p>
      </div>
      <div class="flex gap-3 flex-wrap">
        <a href="tools.html" class="px-5 py-2 border border-cyan-400 rounded-xl text-cyan-300 hover:bg-cyan-400 hover:text-black transition text-sm font-bold">TOOLS</a>
        <a href="index.html" class="px-5 py-2 border border-gray-600 rounded-xl text-gray-400 hover:text-white transition text-sm">HOME</a>
        <button onclick="logout()" class="px-5 py-2 border border-red-500 rounded-xl text-red-400 hover:bg-red-500 hover:text-white transition text-sm font-bold">LOGOUT</button>
      </div>
    </div>

    <div class="card p-8 mb-8 text-center">
      <p class="text-gray-400 text-xs tracking-widest mb-2">YOUR BALANCE</p>
      <div id="credits" class="text-6xl md:text-7xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-400 to-pink-500">--</div>
      <p class="text-cyan-400 text-sm mt-2 tracking-wider">VxH Cr</p>
      <p class="text-gray-500 text-xs mt-1">1 ₹ = 2 VxH Cr</p>
      <button onclick="document.getElementById('buySection').classList.toggle('hidden')"
              class="mt-6 px-8 py-3 bg-gradient-to-r from-cyan-500 to-purple-600 text-black font-bold rounded-xl hover:scale-105 transition text-sm tracking-wider">
        + BUY VxH Cr
      </button>
    </div>

    <div id="buySection" class="hidden mb-10">
      <h2 class="text-lg font-bold text-cyan-300 mb-4 tracking-wider">VxH Cr PACKAGES</h2>
      <div class="grid sm:grid-cols-2 gap-4" id="packages"></div>
      <p class="text-center text-gray-500 text-xs mt-4">Rate: 1 ₹ = 2 VxH Cr • Razorpay Test Mode</p>
    </div>

    <div class="mb-10">
      <h2 class="text-lg font-bold text-cyan-300 mb-4 tracking-wider">FEATURE COSTS (VxH Cr)</h2>
      <div id="features" class="grid sm:grid-cols-2 gap-3"></div>
    </div>

    <div class="card p-6 text-center">
      <p class="text-gray-400 text-sm mb-3">Need more VxH Cr? Contact admin</p>
      <a href="https://t.me/Voidxhubsupport_bot" target="_blank" class="inline-block px-6 py-2 bg-purple-600 hover:bg-purple-500 rounded-xl text-sm font-bold transition">Telegram Support</a>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    const API = "https://voidxhub-backend.onrender.com";
    let user = getUser();
    if (!user) window.location.href = "login.html";

    document.getElementById("username").textContent = user.username;
    document.getElementById("credits").textContent = user.credits;

    async function refresh() {
      const u = await refreshUser();
      if (u) {
        user = u;
        document.getElementById("credits").textContent = u.credits;
        document.getElementById("username").textContent = u.username;
      } else {
        clearUser();
        window.location.href = "login.html";
      }
    }
    refresh();

    async function loadPackages() {
      try {
        const res = await fetch(API + "/api/packages");
        const data = await res.json();
        const box = document.getElementById("packages");
        box.innerHTML = "";
        for (const [id, pack] of Object.entries(data.packages || {})) {
          const rupees = pack.amount / 100;
          const div = document.createElement("div");
          div.className = "card p-5 text-center";
          div.innerHTML = `
            <div class="text-2xl font-black text-white">${pack.credits} VxH Cr</div>
            <div class="text-gray-400 text-sm mt-1">Pay ₹${rupees}</div>
            <button onclick="buyPackage('${id}')" class="mt-4 w-full py-2.5 bg-purple-600 hover:bg-purple-500 rounded-lg font-bold text-sm transition">BUY NOW</button>
          `;
          box.appendChild(div);
        }
      } catch(e) {}
    }
    loadPackages();

    async function loadFeatures() {
      try {
        const res = await fetch(API + "/api/features");
        const data = await res.json();
        const box = document.getElementById("features");
        box.innerHTML = "";
        for (const [key, f] of Object.entries(data.features || {})) {
          const div = document.createElement("div");
          div.className = "card p-4 flex justify-between items-center";
          div.innerHTML = `
            <div>
              <div class="font-bold text-cyan-300 text-sm">${f.name}</div>
              <div class="text-xs text-gray-500">${key}</div>
            </div>
            <div class="text-pink-400 font-bold text-sm">${f.credits} VxH Cr</div>
          `;
          box.appendChild(div);
        }
      } catch(e) {}
    }
    loadFeatures();

    function buyPackage(id) {
      alert("Razorpay Test Mode.\n\nLive keys aane ke baad payment fully chalega.\n\nAbhi VxH Cr chahiye to Telegram pe admin se contact karo.");
    }

    function logout() {
      clearUser();
      fetch(API + "/api/logout", { method: "POST", credentials: "include" }).catch(()=>{});
      window.location.href = "login.html";
    }
  </script>
</body>
</html>
