<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - VOIDXHUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Orbitron', sans-serif; background: #05050a; color: #e0e0ff; min-height: 100vh; }
    .card { background: rgba(17,17,28,0.95); border: 1px solid rgba(103,232,249,0.3); border-radius: 16px; }
    input, select { background: rgba(0,255,255,0.05); border: 1.5px solid #00ffff; color: #e0e0ff; font-family: 'Orbitron', sans-serif; }
    input:focus, select:focus { outline: none; border-color: #ff00ff; box-shadow: 0 0 15px rgba(0,255,255,0.3); }
  </style>
</head>
<body class="p-4 md:p-8">

  <div id="loginScreen" class="max-w-md mx-auto mt-20">
    <div class="card p-8">
      <h1 class="text-2xl font-black text-cyan-400 text-center tracking-widest mb-2">ADMIN PANEL</h1>
      <p class="text-center text-gray-400 text-sm mb-6">VOIDXHUB • VxH Cr System</p>
      <div id="loginMsg" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>
      <form id="adminLoginForm" class="space-y-4">
        <div>
          <label class="block text-cyan-400 text-xs font-bold mb-2">USERNAME</label>
          <input type="text" id="adminUser" value="admin" required class="w-full px-4 py-3 rounded-lg">
        </div>
        <div>
          <label class="block text-cyan-400 text-xs font-bold mb-2">PASSWORD</label>
          <input type="password" id="adminPass" required class="w-full px-4 py-3 rounded-lg" placeholder="Admin password">
        </div>
        <button type="submit" class="w-full py-3 bg-gradient-to-r from-cyan-500 to-purple-600 text-black font-bold rounded-lg tracking-wider hover:scale-105 transition">LOGIN</button>
      </form>
    </div>
  </div>

  <div id="adminDash" class="hidden max-w-5xl mx-auto">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
      <div>
        <h1 class="text-3xl font-black text-cyan-400 tracking-widest">ADMIN PANEL</h1>
        <p class="text-gray-400 text-sm mt-1">Rate: 1 ₹ = 2 VxH Cr</p>
      </div>
      <div class="flex gap-3">
        <button onclick="loadUsers()" class="px-4 py-2 border border-cyan-400 rounded-xl text-cyan-300 text-sm font-bold hover:bg-cyan-400 hover:text-black transition">Refresh</button>
        <button onclick="logoutAdmin()" class="px-4 py-2 border border-red-500 rounded-xl text-red-400 text-sm font-bold hover:bg-red-500 hover:text-white transition">Logout</button>
      </div>
    </div>

    <div class="card p-6 mb-8">
      <h2 class="text-lg font-bold text-cyan-300 mb-4 tracking-wider">ADD / REMOVE VxH Cr</h2>
      <div id="addMsg" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>
      <div class="grid sm:grid-cols-3 gap-4 items-end">
        <div>
          <label class="block text-xs text-gray-400 mb-2">Username</label>
          <input type="text" id="targetUser" placeholder="username" class="w-full px-4 py-3 rounded-lg">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-2">VxH Cr (+ add / - remove)</label>
          <input type="number" id="creditAmount" placeholder="500" class="w-full px-4 py-3 rounded-lg">
        </div>
        <button onclick="addCredits()" class="py-3 bg-gradient-to-r from-emerald-500 to-cyan-500 text-black font-bold rounded-lg hover:scale-105 transition">UPDATE</button>
      </div>
    </div>

    <div class="card p-6 mb-8">
      <h2 class="text-lg font-bold text-cyan-300 mb-4 tracking-wider">SET FEATURE COST (VxH Cr)</h2>
      <div id="costMsg" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>
      <div class="grid sm:grid-cols-3 gap-4 items-end">
        <div>
          <label class="block text-xs text-gray-400 mb-2">Feature</label>
          <select id="featureKey" class="w-full px-4 py-3 rounded-lg">
            <option value="esp">ESP</option>
            <option value="headshot_boost">Headshot Boost</option>
            <option value="aimbot">Aimbot</option>
            <option value="vxh_panel">VxH Panel</option>
            <option value="sensitivity_boost">Sensitivity Boost</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-2">Cost (VxH Cr)</label>
          <input type="number" id="featureCost" placeholder="50" class="w-full px-4 py-3 rounded-lg">
        </div>
        <button onclick="setFeatureCost()" class="py-3 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold rounded-lg hover:scale-105 transition">UPDATE COST</button>
      </div>
    </div>

    <div class="card p-6">
      <h2 class="text-lg font-bold text-cyan-300 mb-4 tracking-wider">ALL USERS</h2>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead>
            <tr class="text-left text-gray-400 border-b border-gray-700">
              <th class="pb-3 pr-4">ID</th>
              <th class="pb-3 pr-4">Username</th>
              <th class="pb-3 pr-4">VxH Cr</th>
              <th class="pb-3 pr-4">Admin</th>
              <th class="pb-3 pr-4">Created</th>
              <th class="pb-3">Last Login</th>
            </tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
      <p id="noUsers" class="text-gray-500 text-center py-8 hidden">No users found</p>
    </div>
  </div>

  <script>
    const API = "https://voidxhub-backend.onrender.com";
    if (localStorage.getItem("vxh_admin") === "1") showDash();

    document.getElementById("adminLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("loginMsg");
      try {
        const res = await fetch(API + "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            username: document.getElementById("adminUser").value.trim(),
            password: document.getElementById("adminPass").value
          })
        });
        const data = await res.json();
        if (data.success && data.user && data.user.is_admin) {
          localStorage.setItem("vxh_admin", "1");
          localStorage.setItem("vxh_user", JSON.stringify(data.user));
          showDash();
        } else {
          msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
          msg.textContent = data.success ? "Not an admin account" : (data.message || "Login failed");
          msg.classList.remove("hidden");
        }
      } catch (err) {
        msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
        msg.textContent = "Server error. Wait 30s if cold start.";
        msg.classList.remove("hidden");
      }
    });

    function showDash() {
      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("adminDash").classList.remove("hidden");
      loadUsers();
    }

    function logoutAdmin() {
      localStorage.removeItem("vxh_admin");
      localStorage.removeItem("vxh_user");
      fetch(API + "/api/logout", { method: "POST", credentials: "include" }).catch(()=>{});
      location.reload();
    }

    async function addCredits() {
      const username = document.getElementById("targetUser").value.trim().toLowerCase();
      const credits = parseInt(document.getElementById("creditAmount").value);
      const msg = document.getElementById("addMsg");
      if (!username || isNaN(credits) || credits === 0) {
        msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
        msg.textContent = "Enter username and non-zero VxH Cr";
        msg.classList.remove("hidden");
        return;
      }
      try {
        const res = await fetch(API + "/api/admin/add-credits", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ username, credits })
        });
        const data = await res.json();
        msg.className = data.success
          ? "mb-4 p-3 rounded-lg text-sm text-center bg-green-900/40 text-green-400 border border-green-500"
          : "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
        msg.textContent = data.success ? (data.message + " | Balance: " + data.new_balance + " VxH Cr") : (data.message || "Failed");
        msg.classList.remove("hidden");
        if (data.success) { document.getElementById("creditAmount").value = ""; loadUsers(); }
      } catch (err) {
        msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
        msg.textContent = "Error. Login as admin again.";
        msg.classList.remove("hidden");
      }
    }

    async function setFeatureCost() {
      const feature = document.getElementById("featureKey").value;
      const credits = parseInt(document.getElementById("featureCost").value);
      const msg = document.getElementById("costMsg");
      if (isNaN(credits) || credits < 0) {
        msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
        msg.textContent = "Enter valid cost";
        msg.classList.remove("hidden");
        return;
      }
      try {
        const res = await fetch(API + "/api/admin/set-feature-cost", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({ feature, credits })
        });
        const data = await res.json();
        msg.className = data.success
          ? "mb-4 p-3 rounded-lg text-sm text-center bg-green-900/40 text-green-400 border border-green-500"
          : "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
        msg.textContent = data.success ? "Cost updated: " + feature + " = " + credits + " VxH Cr" : (data.message || "Failed");
        msg.classList.remove("hidden");
      } catch (err) {
        msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
        msg.textContent = "Error";
        msg.classList.remove("hidden");
      }
    }

    async function loadUsers() {
      try {
        const res = await fetch(API + "/api/admin/users", { credentials: "include" });
        const data = await res.json();
        const tbody = document.getElementById("usersTable");
        tbody.innerHTML = "";
        if (!data.success || !data.users || !data.users.length) {
          document.getElementById("noUsers").classList.remove("hidden");
          return;
        }
        document.getElementById("noUsers").classList.add("hidden");
        data.users.forEach(u => {
          const tr = document.createElement("tr");
          tr.className = "border-b border-gray-800 hover:bg-white/5";
          tr.innerHTML = `
            <td class="py-3 pr-4 text-gray-400">${u.id}</td>
            <td class="py-3 pr-4 font-bold text-cyan-300">${u.username}</td>
            <td class="py-3 pr-4 text-pink-400 font-bold">${u.credits} VxH Cr</td>
            <td class="py-3 pr-4">${u.is_admin ? "✅" : "-"}</td>
            <td class="py-3 pr-4 text-gray-500 text-xs">${u.created_at || "-"}</td>
            <td class="py-3 text-gray-500 text-xs">${u.last_login || "-"}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {}
    }
  </script>
</body>
</html>
