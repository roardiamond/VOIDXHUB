<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOIDXHUB - PAYMENT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: #05050a;
      color: #e0e0ff;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-blackhole {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1a0033 10%, #000000 85%);
      z-index: -3;
    }
    .card {
      background: rgba(17, 17, 24, 0.95);
      border: 2px solid rgba(103, 232, 249, 0.4);
      border-radius: 24px;
      transition: all 0.4s ease;
    }
    .card:hover {
      border-color: #67e8f9;
      box-shadow: 0 0 40px rgba(103, 232, 249, 0.3);
    }
    .pay-btn {
      background: linear-gradient(to right, #22c55e, #16a34a);
      transition: all 0.35s ease;
    }
    .pay-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.6);
    }
    .paid-btn {
      background: linear-gradient(to right, #06b6d4, #9333ea);
      transition: all 0.35s ease;
    }
    .paid-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px rgba(103, 232, 249, 0.6);
    }
    #qrcode {
      background: white;
      padding: 16px;
      border-radius: 16px;
      display: inline-block;
    }
    .price-tag {
      background: linear-gradient(to right, #06b6d4, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div class="bg-blackhole"></div>

  <div class="relative z-10 min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full">

      <!-- Title -->
      <div class="text-center mb-8">
        <h1 class="text-4xl font-black tracking-wider">
          VOID<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500">X</span>HUB
        </h1>
        <p class="text-cyan-300 mt-2 tracking-widest text-sm">SECURE PAYMENT</p>
      </div>

      <!-- Main Card -->
      <div class="card p-8 text-center">

        <!-- Detected Info -->
        <div class="mb-6">
          <p class="text-gray-400 text-sm mb-1">Selected Plan</p>
          <h2 id="planName" class="text-2xl font-bold text-white mb-1">Loading...</h2>
          <p id="brandName" class="text-cyan-300 text-lg uppercase tracking-wider"></p>
        </div>

        <!-- Price -->
        <div class="mb-8">
          <p class="text-gray-400 text-sm mb-1">Amount to Pay</p>
          <h1 id="priceDisplay" class="text-5xl font-black price-tag">₹0</h1>
        </div>

        <!-- QR Section -->
        <div id="qrSection" class="hidden mb-6">
          <p class="text-green-400 font-bold mb-3">Scan with Google Pay / Any UPI App</p>
          <div id="qrcode" class="mx-auto"></div>
          <p class="text-xs text-gray-400 mt-3">Amount already set • No need to enter manually</p>
          <p id="upiStatus" class="text-xs mt-2"></p>
        </div>

        <!-- Pay Button -->
        <button id="payBtn" onclick="generateQR()" 
                class="pay-btn w-full py-4 rounded-2xl text-white font-bold text-lg mb-4">
          Pay Now → Generate QR
        </button>

        <!-- I Have Paid Button (after QR) -->
        <button id="paidBtn" onclick="confirmPayment()" 
                class="paid-btn w-full py-4 rounded-2xl text-white font-bold text-lg mb-4 hidden">
          I Have Paid ✓
        </button>

        <!-- Status Message -->
        <div id="statusMsg" class="hidden text-sm mt-4 p-3 rounded-xl"></div>

        <!-- After Payment Note -->
        <div id="afterPay" class="hidden text-sm text-yellow-300 mt-4">
          Payment ke baad screenshot bhejo Telegram pe<br>
          <a href="https://t.me/Voidxhubsupport_bot" target="_blank" class="underline text-cyan-300">@Voidxhubsupport_bot</a>
        </div>

        <!-- Back -->
        <button onclick="window.history.back()" 
                class="mt-6 text-gray-400 hover:text-white text-sm transition">
          ← Go Back
        </button>
      </div>

      <p class="text-center text-xs text-gray-500 mt-6">
        Secure UPI Payment • Amount Auto Filled
      </p>
    </div>
  </div>

  <script>
    // ================== CONFIG ==================
    const UPI_ID = "yashrawat9873-1@oksbi";
    const PAYEE_NAME = "VOIDXHUB";
    // ============================================

    // Get URL Parameters
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type') || 'public';
    const brand = urlParams.get('brand') || 'unknown';
    let price = urlParams.get('price') || '600';

    // Validate price (600 - 3500 only)
    price = Math.max(600, Math.min(3500, parseInt(price) || 600));

    // Display Info
    const planNames = {
      public: "PUBLIC BYPASS",
      private: "PRIVATE BYPASS",
      personal: "PERSONAL BYPASS"
    };

    document.getElementById('planName').textContent = planNames[type] || type.toUpperCase();
    document.getElementById('brandName').textContent = brand.toUpperCase();
    document.getElementById('priceDisplay').textContent = "₹" + price;

    // ========== UPI URL VALIDATION ==========
    function validateUPIString(upiString) {
      // Basic UPI validation
      if (!upiString.startsWith("upi://pay?")) {
        return { valid: false, msg: "Invalid UPI protocol" };
      }
      if (!upiString.includes("pa=" + UPI_ID)) {
        return { valid: false, msg: "UPI ID mismatch" };
      }
      if (!upiString.includes("am=" + price)) {
        return { valid: false, msg: "Amount mismatch" };
      }
      if (!upiString.includes("cu=INR")) {
        return { valid: false, msg: "Currency missing" };
      }
      return { valid: true, msg: "UPI URL Valid ✓" };
    }

    // ========== GENERATE QR ==========
    function generateQR() {
      // Build UPI Payment String
      const upiString = `upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(PAYEE_NAME)}&am=${price}&cu=INR&tn=${encodeURIComponent(brand.toUpperCase() + ' ' + type.toUpperCase() + ' Bypass')}`;

      // Validate
      const validation = validateUPIString(upiString);
      const statusEl = document.getElementById('upiStatus');

      if (!validation.valid) {
        statusEl.innerHTML = `<span class="text-red-400">${validation.msg}</span>`;
        alert("UPI Error: " + validation.msg);
        return;
      }

      statusEl.innerHTML = `<span class="text-green-400">${validation.msg}</span>`;

      // Clear previous QR
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';

      // Generate QR Code
      QRCode.toCanvas(upiString, {
        width: 220,
        margin: 2,
        color: {
          dark: '#000000',
          light: '#ffffff'
        }
      }, function (error, canvas) {
        if (error) {
          console.error(error);
          alert("QR generate nahi hua. Refresh karke try kar.");
          return;
        }
        qrContainer.appendChild(canvas);
      });

      // Show sections
      document.getElementById('qrSection').classList.remove('hidden');
      document.getElementById('afterPay').classList.remove('hidden');
      document.getElementById('paidBtn').classList.remove('hidden');

      // Disable pay button
      const payBtn = document.getElementById('payBtn');
      payBtn.textContent = "QR Generated ✓";
      payBtn.disabled = true;
      payBtn.style.opacity = "0.7";
    }

    // ========== PAYMENT CONFIRM + WEBHOOK READY ==========
    function confirmPayment() {
      const statusDiv = document.getElementById('statusMsg');
      statusDiv.classList.remove('hidden');
      statusDiv.className = "text-sm mt-4 p-3 rounded-xl bg-yellow-500/20 text-yellow-300 border border-yellow-500/40";
      statusDiv.innerHTML = "⏳ Payment verify ho raha hai... Screenshot Telegram pe bhej do";

      // ========== WEBHOOK READY STRUCTURE ==========
      // Real webhook ke liye backend chahiye (Node/PHP/Python)
      // Example payload jo backend ko bhej sakte ho:

      const paymentData = {
        upi_id: UPI_ID,
        amount: price,
        brand: brand,
        plan: type,
        status: "pending_verification",
        timestamp: new Date().toISOString(),
        user_agent: navigator.userAgent
      };

      console.log("Payment Data (Webhook ready):", paymentData);

      // Agar tera backend hai to yahan fetch laga sakta hai:
      /*
      fetch("https://your-backend.com/api/payment-webhook", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(paymentData)
      })
      .then(res => res.json())
      .then(data => {
        statusDiv.className = "text-sm mt-4 p-3 rounded-xl bg-green-500/20 text-green-300 border border-green-500/40";
        statusDiv.innerHTML = "✅ Payment Verified! Access mil jayega jaldi.";
      })
      .catch(err => {
        statusDiv.innerHTML = "⚠️ Auto verify fail. Manual screenshot bhejo.";
      });
      */

      // Abhi ke liye manual flow
      setTimeout(() => {
        statusDiv.className = "text-sm mt-4 p-3 rounded-xl bg-green-500/20 text-green-300 border border-green-500/40";
        statusDiv.innerHTML = "✅ Screenshot bhej diya? Support team verify karegi.<br><a href='https://t.me/Voidxhubsupport_bot' target='_blank' class='underline'>Telegram pe jaao →</a>";
      }, 1500);
    }
  </script>
</body>
</html>
