<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VOIDXHUB - PAYMENT</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Orbitron', sans-serif; background: #05050a; color: #e0e0ff; min-height: 100vh; overflow-x: hidden; }
    .bg-blackhole { position: fixed; inset: 0; background: radial-gradient(circle at center, #1a0033 10%, #000000 85%); z-index: -3; }
    .card { background: rgba(17,17,24,0.95); border: 2px solid rgba(103,232,249,0.4); border-radius: 24px; }
    .pay-btn { background: linear-gradient(to right, #22c55e, #16a34a); transition: all 0.35s ease; }
    .pay-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(34,197,94,0.6); }
    .paid-btn { background: linear-gradient(to right, #06b6d4, #9333ea); transition: all 0.35s ease; }
    .paid-btn:hover { transform: scale(1.05); }
    #qrcode { background: white; padding: 16px; border-radius: 16px; display: inline-block; }
    .price-tag { background: linear-gradient(to right, #06b6d4, #9333ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    input { background: rgba(0,255,255,0.05); border: 1.5px solid #00ffff; color: #e0e0ff; font-family: 'Orbitron', sans-serif; }
    input:focus { outline: none; border-color: #ff00ff; }
  </style>
</head>
<body>
  <div class="bg-blackhole"></div>

  <div class="relative z-10 min-h-screen flex items-center justify-center px-4 py-12">
    <div class="max-w-md w-full">
      <div class="text-center mb-8">
        <h1 class="text-4xl font-black tracking-wider">
          VOID<span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-purple-500 to-pink-500">X</span>HUB
        </h1>
        <p class="text-cyan-300 mt-2 tracking-widest text-sm">SECURE PAYMENT • VxH Cr</p>
      </div>

      <div class="card p-8 text-center">
        <div class="mb-6">
          <p class="text-gray-400 text-sm mb-1">Selected Plan</p>
          <h2 id="planName" class="text-2xl font-bold text-white mb-1">Loading...</h2>
          <p id="brandName" class="text-cyan-300 text-lg uppercase tracking-wider"></p>
          <p id="toolName" class="text-gray-400 text-xs mt-1"></p>
        </div>

        <div class="mb-6">
          <p class="text-gray-400 text-sm mb-1">Cost</p>
          <h1 id="creditsDisplay" class="text-4xl font-black price-tag">0 VxH Cr</h1>
          <p id="priceDisplay" class="text-gray-400 text-sm mt-2">Pay ₹0 via UPI</p>
          <p class="text-xs text-gray-500 mt-1">1 ₹ = 2 VxH Cr</p>
        </div>

        <div class="mb-6 text-left">
          <label class="block text-xs text-cyan-400 mb-2 tracking-wider">YOUR TELEGRAM (required)</label>
          <input type="text" id="telegramInput" placeholder="@username" class="w-full px-4 py-3 rounded-lg text-sm">
        </div>

        <div id="qrSection" class="hidden mb-6">
          <p class="text-green-400 font-bold mb-3">Scan with Google Pay / Any UPI App</p>
          <div id="qrcode" class="mx-auto"></div>
          <p class="text-xs text-gray-400 mt-3">Amount already set</p>
        </div>

        <button id="payBtn" onclick="generateQR()" class="pay-btn w-full py-4 rounded-2xl text-white font-bold text-lg mb-4">
          Pay Now → Generate QR
        </button>

        <button id="paidBtn" onclick="confirmPayment()" class="paid-btn w-full py-4 rounded-2xl text-white font-bold text-lg mb-4 hidden">
          I Have Paid ✓
        </button>

        <div id="statusMsg" class="hidden text-sm mt-4 p-3 rounded-xl"></div>

        <div id="orderBox" class="hidden mt-4 p-4 rounded-xl bg-green-900/30 border border-green-500/40 text-left text-sm">
          <p class="text-green-400 font-bold mb-2">Order Created!</p>
          <p class="text-gray-300">Order Code: <span id="orderCode" class="text-cyan-300 font-bold"></span></p>
          <p class="text-gray-400 text-xs mt-2">Save this code. After admin verifies, download link will appear in <a href="my-orders.html" class="text-cyan-400 underline">My Orders</a>.</p>
        </div>

        <div class="mt-6 flex flex-col gap-2">
          <a href="my-orders.html" class="text-cyan-400 text-sm hover:underline">📦 My Orders</a>
          <button onclick="window.history.back()" class="text-gray-400 hover:text-white text-sm">← Go Back</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const API = "https://voidxhub-backend.onrender.com";
    const UPI_ID = "yashrawat9873-1@oksbi";
    const PAYEE_NAME = "VOIDXHUB";

    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type') || 'public';
    const brand = urlParams.get('brand') || 'unknown';
    const tool = urlParams.get('tool') || 'unknown';
    let credits = parseInt(urlParams.get('credits')) || 0;
    let price = parseInt(urlParams.get('price')) || 0;
    if (credits && !price) price = Math.round(credits / 2);
    if (price && !credits) credits = price * 2;
    price = Math.max(1, Math.min(10000, price));

    const planNames = { public: "PUBLIC BYPASS", private: "PRIVATE BYPASS", personal: "PERSONAL BYPASS" };
    document.getElementById('planName').textContent = planNames[type] || type.toUpperCase();
    document.getElementById('brandName').textContent = brand.toUpperCase();
    document.getElementById('toolName').textContent = tool.toUpperCase();
    document.getElementById('creditsDisplay').textContent = credits + " VxH Cr";
    document.getElementById('priceDisplay').textContent = "Pay ₹" + price + " via UPI";

    // Prefill telegram from localStorage if any
    try {
      const u = JSON.parse(localStorage.getItem("vxh_user") || "null");
      if (u && u.username) {
        // leave telegram empty for user to fill
      }
    } catch(e) {}

    function generateQR() {
      const tg = document.getElementById('telegramInput').value.trim();
      if (!tg) {
        alert("Please enter your Telegram username");
        return;
      }

      const upiString = `upi://pay?pa=${UPI_ID}&pn=${encodeURIComponent(PAYEE_NAME)}&am=${price}&cu=INR&tn=${encodeURIComponent(brand.toUpperCase() + ' ' + type.toUpperCase() + ' ' + credits + ' VxH Cr')}`;

      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';

      QRCode.toCanvas(upiString, {
        width: 220, margin: 2,
        color: { dark: '#000000', light: '#ffffff' }
      }, function (error, canvas) {
        if (error) { alert("QR error. Refresh try again."); return; }
        qrContainer.appendChild(canvas);
      });

      document.getElementById('qrSection').classList.remove('hidden');
      document.getElementById('paidBtn').classList.remove('hidden');
      const payBtn = document.getElementById('payBtn');
      payBtn.textContent = "QR Generated ✓";
      payBtn.disabled = true;
      payBtn.style.opacity = "0.7";
    }

    async function confirmPayment() {
      const tg = document.getElementById('telegramInput').value.trim();
      if (!tg) {
        alert("Telegram username required");
        return;
      }

      const statusDiv = document.getElementById('statusMsg');
      statusDiv.classList.remove('hidden');
      statusDiv.className = "text-sm mt-4 p-3 rounded-xl bg-yellow-500/20 text-yellow-300 border border-yellow-500/40";
      statusDiv.innerHTML = "⏳ Creating order & notifying admin...";

      let username = "guest";
      try {
        const u = JSON.parse(localStorage.getItem("vxh_user") || "null");
        if (u && u.username) username = u.username;
      } catch(e) {}

      try {
        const res = await fetch(API + "/api/orders/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            tool, type, brand,
            credits, price,
            telegram: tg,
            username
          })
        });
        const data = await res.json();

        if (data.success) {
          statusDiv.className = "text-sm mt-4 p-3 rounded-xl bg-green-500/20 text-green-300 border border-green-500/40";
          statusDiv.innerHTML = "✅ Order placed! Admin ko Telegram pe notify ho gaya.";
          document.getElementById('orderBox').classList.remove('hidden');
          document.getElementById('orderCode').textContent = data.order_code;
          localStorage.setItem("vxh_last_order", data.order_code);
          localStorage.setItem("vxh_last_tg", tg);

          document.getElementById('paidBtn').disabled = true;
          document.getElementById('paidBtn').textContent = "Order Submitted ✓";
        } else {
          statusDiv.className = "text-sm mt-4 p-3 rounded-xl bg-red-500/20 text-red-300 border border-red-500/40";
          statusDiv.innerHTML = data.message || "Failed. Try again.";
        }
      } catch (err) {
        statusDiv.className = "text-sm mt-4 p-3 rounded-xl bg-red-500/20 text-red-300 border border-red-500/40";
        statusDiv.innerHTML = "Server error. Wait 30s if cold start, then retry.";
      }
    }
  </script>
</body>
</html>
