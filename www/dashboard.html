<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — VOIDXHUB</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="static/icons/icon-192.png">
<link rel="apple-touch-icon" href="static/icons/icon-192.png">
<meta name="theme-color" content="#08080c">
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<section class="section">
  <div class="wrap">
    <span class="eyebrow">// account</span>
    <h1 style="font-size:32px;">Dashboard</h1>

    <div class="card-plain" style="margin-top:24px; max-width:520px;">
      <h3 style="font-size:17px; margin-bottom:12px;">Your account</h3>
      <div id="account-info" class="mono" style="font-size:13px; color:var(--fog-dim); line-height:1.9;">Loading…</div>
    </div>

    <div class="card-plain" style="margin-top:16px; max-width:520px;">
      <h3 style="font-size:17px; margin-bottom:12px;">Change password</h3>
      <div id="pw-alert"></div>
      <form id="pw-form">
        <div class="field"><label>Current password</label><input type="password" name="current_password" required></div>
        <div class="field"><label>New password</label><input type="password" name="new_password" required minlength="8">
          <div class="hint">At least 8 characters.</div>
        </div>
        <button class="btn btn-primary" type="submit">Update password</button>
      </form>
      <p style="margin-top:14px; font-size:13px; color:var(--fog-dim);">
        Signed in somewhere you don't recognise?
        <button class="btn btn-ghost btn-sm" id="logout-everywhere-btn" type="button" style="margin-left:6px;">Log out everywhere</button>
      </p>
    </div>

    <h2 style="font-size:22px; margin-top:40px;">Your slots &amp; payments</h2>
    <div id="list" style="margin-top:20px; display:flex; flex-direction:column; gap:16px;">
      <p class="mono" style="color:var(--fog-dim)">Loading…</p>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="static/js/config.js"></script>
<script src="static/js/api.js"></script>
<script src="static/js/ui.js"></script>
<script src="static/js/pages/dashboard.js"></script>
</body>
</html>
