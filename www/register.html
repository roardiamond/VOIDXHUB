<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — VOIDXHUB</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="static/icons/icon-192.png">
<link rel="apple-touch-icon" href="static/icons/icon-192.png">
<meta name="theme-color" content="#08080c">
<link rel="stylesheet" href="static/css/style.css">
</head>
<body>

<nav class="site-nav" id="site-nav"></nav>

<section class="section">
  <div class="wrap" style="max-width:420px;">
    <span class="eyebrow">// new account</span>
    <h1 style="font-size:32px; margin-bottom:24px;">Create your account</h1>
    <div class="form-card">
      <div id="alert"></div>
      <form id="register-form">
        <div class="field"><label>Username</label><input type="text" name="username" required minlength="3"></div>
        <div class="field"><label>Email</label><input type="email" name="email" required></div>
        <div class="field"><label>Phone (optional)</label><input type="tel" name="phone"></div>
        <div class="field"><label>Password</label><input type="password" name="password" required minlength="6">
          <div class="hint">At least 6 characters.</div>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Sign up</button>
      </form>
      <p style="margin-top:18px; font-size:14px; color:var(--fog-dim);">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </div>
  </div>
</section>

<footer id="site-footer"></footer>

<script src="static/js/config.js"></script>
<script src="static/js/api.js"></script>
<script src="static/js/ui.js"></script>
<script src="static/js/pages/register.js"></script>
</body>
</html>
