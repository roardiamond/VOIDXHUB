<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - VOIDXHUB</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Orbitron', sans-serif;
      background: #05050a;
      color: #e0e0ff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .login-box {
      background: #0a0a15;
      border: 2px solid #00ffff;
      border-radius: 16px;
      box-shadow: 0 0 40px rgba(0,255,255,0.25);
      width: 100%;
      max-width: 420px;
      padding: 40px;
    }
    input {
      background: rgba(0,255,255,0.05);
      border: 2px solid #00ffff;
      color: #e0e0ff;
      font-family: 'Orbitron', sans-serif;
    }
    input:focus {
      outline: none;
      border-color: #ff00ff;
      box-shadow: 0 0 20px rgba(0,255,255,0.4);
    }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-black text-cyan-400 tracking-widest">VOIDXHUB</h1>
      <p class="text-pink-400 text-sm mt-2 tracking-wider">LOGIN TO YOUR ACCOUNT</p>
    </div>

    <div id="msg" class="hidden mb-4 p-3 rounded-lg text-sm text-center"></div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-cyan-400 text-xs font-bold mb-2 tracking-wider">USERNAME</label>
        <input type="text" id="username" required placeholder="Enter username"
               class="w-full px-4 py-3 rounded-lg">
      </div>
      <div>
        <label class="block text-cyan-400 text-xs font-bold mb-2 tracking-wider">PASSWORD</label>
        <input type="password" id="password" required placeholder="Enter password"
               class="w-full px-4 py-3 rounded-lg">
      </div>

      <button type="submit" id="btn"
              class="w-full py-3 bg-gradient-to-r from-cyan-500 to-purple-600 text-black font-bold rounded-lg tracking-wider hover:scale-105 transition">
        LOGIN
      </button>
    </form>

    <div class="text-center mt-6 text-sm text-gray-400">
      Don't have account?
      <a href="register.html" class="text-cyan-400 font-bold hover:underline">Register</a>
    </div>
  </div>

  <script>
    const API = "https://voidxhub-backend.onrender.com";

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btn");
      const msg = document.getElementById("msg");
      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        const res = await fetch(API + "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await res.json();

        if (data.success) {
          localStorage.setItem("vxh_user", JSON.stringify(data.user));
          msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-green-900/40 text-green-400 border border-green-500";
          msg.textContent = "Login successful! Redirecting...";
          msg.classList.remove("hidden");
          setTimeout(() => window.location.href = "dashboard.html", 1000);
        } else {
          msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
          msg.textContent = data.message || "Login failed";
          msg.classList.remove("hidden");
          btn.disabled = false;
          btn.textContent = "LOGIN";
        }
      } catch (err) {
        msg.className = "mb-4 p-3 rounded-lg text-sm text-center bg-red-900/40 text-red-400 border border-red-500";
        msg.textContent = "Server error. Try again.";
        msg.classList.remove("hidden");
        btn.disabled = false;
        btn.textContent = "LOGIN";
      }
    });
  </script>
</body>
</html>
